:root{
  --forest:#0E3B2C; --forest-2:#13503A; --emerald:#1F6E43; --green:#2E9E5B;
  --green-soft:#E3F1E7; --green-line:#CBE2D2;
  --gold:#C18F2B; --gold-2:#E6B84B; --gold-soft:#F6ECD2;
  --clay:#A8392F; --clay-soft:#F6DEDA;
  --ivory:#F4F1E8; --paper:#FBFAF4; --card:#FFFFFF;
  --ink:#19231D; --muted:#6E7B70; --line:#E4E2D4; --line-2:#EFEDE2;
  --shadow:0 1px 2px rgba(20,40,30,.05),0 10px 30px -16px rgba(20,50,35,.22);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--ivory); color:var(--ink);
  font-family:'Sarabun',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:15px; line-height:1.5; letter-spacing:.1px;
  -webkit-font-smoothing:antialiased;
}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;}
.wrap{max-width:1180px;margin:0 auto;padding:0 22px}

/* ---------- Header ---------- */
header.top{
  background:
    radial-gradient(120% 140% at 88% -20%, rgba(230,184,75,.16), transparent 55%),
    linear-gradient(160deg,#0E3B2C 0%,#10442F 55%,#0B3325 100%);
  color:#EAF3EC; position:relative; overflow:hidden;
}
header.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;
  background:linear-gradient(90deg,var(--gold) 0%,var(--gold-2) 40%,transparent 92%)}
.top-inner{padding:30px 0 26px;position:relative;z-index:1}
.eyebrow{display:flex;align-items:center;gap:10px;font-weight:600;font-size:12.5px;
  letter-spacing:2.4px;text-transform:uppercase;color:var(--gold-2)}
.eyebrow .dot{width:7px;height:7px;border-radius:50%;background:var(--gold-2);
  box-shadow:0 0 0 4px rgba(230,184,75,.18)}
h1.title{margin:.32em 0 .12em;font-weight:800;font-size:clamp(28px,4.4vw,42px);
  line-height:1.04;letter-spacing:.2px;color:#fff}
.title .yr{color:var(--gold-2)}
.subtitle{color:#BCD4C4;font-weight:400;max-width:60ch}
.meta-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;
  padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.14);color:#D7E7DC}
.chip b{color:#fff;font-weight:800}

/* ---------- Tabs ---------- */
nav.tabs{position:sticky;top:0;z-index:20;background:rgba(244,241,232,.92);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.tabs-inner{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs-inner::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:transparent;cursor:pointer;white-space:nowrap;
  font-family:inherit;font-size:14px;font-weight:700;color:var(--muted);
  padding:15px 16px 13px;border-bottom:2.5px solid transparent;transition:.18s;letter-spacing:.2px}
.tab:hover{color:var(--emerald)}
.tab[aria-selected="true"]{color:var(--forest);border-color:var(--gold)}
.tab .tab-sub{font-weight:600;font-size:11px;color:var(--muted);margin-left:7px;
  background:var(--green-soft);padding:2px 7px;border-radius:999px}
.tab[aria-selected="true"] .tab-sub{background:var(--gold-soft);color:var(--gold)}

main{padding:30px 0 70px}
.panel{display:none;animation:fade .4s ease both}
.panel.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- Section heads ---------- */
.sec-head{display:flex;align-items:baseline;gap:12px;margin:34px 0 14px}
.sec-head:first-child{margin-top:4px}
.sec-head .kx{font-weight:800;font-size:12px;letter-spacing:1.6px;text-transform:uppercase;
  color:var(--gold);background:var(--gold-soft);padding:4px 9px;border-radius:6px}
.sec-head h2{margin:0;font-size:19px;font-weight:800;color:var(--forest);letter-spacing:.2px}
.sec-head .hint{margin-left:auto;font-size:12.5px;color:var(--muted)}

/* ---------- KPI cards ---------- */
.kpis{display:grid;gap:14px;grid-template-columns:repeat(4,1fr)}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px;
  box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi .lab{font-size:12.5px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:7px}
.kpi .lab .ic{width:9px;height:9px;border-radius:3px;background:var(--green)}
.kpi .val{font-size:27px;font-weight:800;letter-spacing:.3px;margin-top:7px;color:var(--ink)}
.kpi .val .cur{font-size:15px;font-weight:700;color:var(--muted);margin-right:3px}
.kpi .foot{font-size:12px;color:var(--muted);margin-top:4px}
.kpi.k-paid .ic{background:var(--green)} .kpi.k-paid .val{color:var(--emerald)}
.kpi.k-out .ic{background:var(--clay)} .kpi.k-out .val{color:var(--clay)}
.kpi.k-pct .ic{background:var(--gold)}
.kpi.span2{grid-column:span 2}

/* hero stock card — full-width banner */
.kpi.hero{grid-column:1/-1;color:#EAF3EC;border:0;display:flex;align-items:center;
  justify-content:space-between;gap:18px;flex-wrap:wrap;padding:20px 24px;
  background:radial-gradient(120% 200% at 92% -40%,rgba(230,184,75,.30),transparent 52%),
  linear-gradient(155deg,#13503A,#0E3B2C)}
.kpi.hero .lab{color:var(--gold-2)} .kpi.hero .lab .ic{background:var(--gold-2)}
.kpi.hero .hero-main{position:relative;z-index:1}
.kpi.hero .val{color:#fff;font-size:36px;margin-top:4px}
.kpi.hero .val .cur{color:var(--gold-2)}
.kpi.hero .hero-side{position:relative;z-index:1;font-size:13px;color:#Bcd4c4;max-width:340px;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);
  padding:11px 15px;border-radius:12px;line-height:1.55}
.kpi.hero .hero-side b{color:#fff;font-weight:800}
.kpi.hero .foot{color:#AFCBBB}
.kpi.hero .coin{position:absolute;right:128px;top:50%;transform:translateY(-50%);
  width:130px;height:130px;border-radius:50%;border:11px solid rgba(230,184,75,.13);pointer-events:none}
.kpi.hero .coin::after{content:"฿";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  font-size:46px;font-weight:800;color:rgba(230,184,75,.22)}

/* progress bar inside pct */
.bar{height:7px;border-radius:999px;background:var(--line-2);margin-top:11px;overflow:hidden}
.bar > i{display:block;height:100%;border-radius:999px;
  background:linear-gradient(90deg,var(--green),var(--emerald));width:0;transition:width 1s cubic-bezier(.22,1,.36,1)}

/* ---------- Combined summary banner ---------- */
.combo{border-radius:18px;color:#EAF3EC;padding:20px 22px;box-shadow:var(--shadow);
  background:radial-gradient(120% 200% at 92% -60%,rgba(230,184,75,.26),transparent 55%),
  linear-gradient(150deg,#13503A,#0E3B2C);position:relative;overflow:hidden}
.combo-head{font-size:13px;font-weight:800;color:var(--gold-2);letter-spacing:.4px;
  display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.combo-head span{font-size:11.5px;font-weight:600;color:#9FBDAB;letter-spacing:0}
.combo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.combo-grid > div{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
  border-radius:13px;padding:13px 15px}
.combo .cl{font-size:12px;font-weight:600;color:#BCD4C4}
.combo .cv{font-size:25px;font-weight:800;color:#fff;margin-top:5px}
.combo .cv .cur{font-size:14px;font-weight:700;color:var(--gold-2);margin-right:3px}
@media (max-width:680px){.combo-grid{grid-template-columns:1fr 1fr}}

/* ---------- Chart panels ---------- */
.charts{display:grid;gap:14px;grid-template-columns:1.05fr 1.25fr 1fr;margin-top:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;
  box-shadow:var(--shadow)}
.card .ch-head{padding:15px 17px 4px}
.card .ch-head .t{font-weight:800;font-size:14.5px;color:var(--forest)}
.card .ch-head .s{font-size:12px;color:var(--muted);margin-top:1px}
.card .ch-body{padding:8px 16px 18px}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:6px;padding:0 17px 16px}
.legend .li{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:#3a463d}
.legend .sw{width:11px;height:11px;border-radius:3px}
.legend .li small{color:var(--muted);font-weight:600;margin-left:2px}

.donut-wrap{display:flex;align-items:center;justify-content:center;padding:6px 0 2px}
.donut-center .big{font-size:19px;font-weight:800;fill:var(--forest)}
.donut-center .sm{font-size:10.5px;font-weight:700;fill:var(--muted)}

/* ---------- Tables ---------- */
.tbl-card{background:var(--card);border:1px solid var(--line);border-radius:16px;
  box-shadow:var(--shadow);overflow:hidden;margin-top:6px}
table{width:100%;border-collapse:collapse}
thead th{background:var(--forest);color:#DCEBE0;font-weight:700;font-size:12.5px;
  text-align:left;padding:12px 14px;letter-spacing:.2px;white-space:nowrap}
thead th.r{text-align:right}
tbody td{padding:11px 14px;border-top:1px solid var(--line-2);font-size:14px;vertical-align:middle}
tbody tr:nth-child(even){background:#FAFAF4}
tbody tr:hover{background:var(--green-soft)}
td.r{text-align:right;font-weight:700} td.c{text-align:center}
td.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.pname{font-weight:700}
tfoot td{padding:13px 14px;border-top:2px solid var(--green-line);
  background:var(--green-soft);font-weight:800;color:var(--forest);font-size:14px}
tfoot td.r{text-align:right}
.dim td{color:#9aa69d}
.chip-st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;
  padding:4px 10px;border-radius:999px}
.chip-st::before{content:"";width:7px;height:7px;border-radius:50%}
.st-paid{background:var(--green-soft);color:var(--emerald)} .st-paid::before{background:var(--green)}
.st-wait{background:var(--clay-soft);color:var(--clay)} .st-wait::before{background:var(--clay)}
.tag{font-size:11.5px;font-weight:700;color:var(--muted);background:var(--ivory);
  border:1px solid var(--line);padding:3px 9px;border-radius:7px;white-space:nowrap}

/* two-up */
.grid2{display:grid;gap:14px;grid-template-columns:1.4fr 1fr;align-items:start;margin-top:6px}
.note{background:linear-gradient(155deg,#13503A,#0E3B2C);color:#EAF3EC;border-radius:16px;
  padding:20px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.note .l{font-size:12.5px;font-weight:700;color:var(--gold-2);letter-spacing:.4px}
.note .v{font-size:32px;font-weight:800;margin:6px 0 8px;color:#fff}
.note .v .cur{color:var(--gold-2);font-size:16px;margin-right:3px}
.note .eq{font-size:12.5px;color:#B6D0C0;line-height:1.6}
.note .eq code{background:rgba(255,255,255,.1);padding:1px 7px;border-radius:6px;
  font-family:inherit;color:#fff;font-weight:700}

footer{color:var(--muted);font-size:12.5px;text-align:center;padding:0 0 40px}
footer .gd{color:var(--gold);font-weight:700}

@media (max-width:920px){
  .charts{grid-template-columns:1fr 1fr}
  .charts .card:last-child{grid-column:span 2}
  .grid2{grid-template-columns:1fr}
}
@media (max-width:680px){
  .kpis{grid-template-columns:1fr 1fr}
  .kpi.hero,.kpi.span2{grid-column:span 2}
  .charts{grid-template-columns:1fr}
  .charts .card:last-child{grid-column:auto}
  .scroll-x{overflow-x:auto}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap top-inner">
    <div class="eyebrow"><span class="dot"></span>Business Development · Income 2026</div>
    <h1 class="title">Tales Runner <span class="yr">2026</span></h1>
    <p class="subtitle">สรุปรายรับจาก Partner / สปอนเซอร์ ปีงบประมาณ 2026</p>
    <div class="meta-chips">
      <span class="chip">หน่วย <b>บาท (THB)</b></span>
      <span class="chip">ปีงบประมาณ <b>2026</b></span>
      <span class="chip">รายรับรวม <b>฿1,005,000</b></span>
      <span class="chip">MONEY IN STOCK <b>฿755,000</b></span>
    </div>
  </div>
</header>

<main class="wrap">
  <section id="tr"></section>
  <footer>
    จัดทำโดย <span class="gd">Business Development</span> · ข้อมูลจากไฟล์ Business Development Budget Plan 2026 · หน่วย: บาท (THB)
  </footer>
</main>

<script>
const DATA = {"tr": {"name": "Tales Runner", "kpi": {"total": 1005000, "paid": 525000, "outstanding": 430000, "pct": 0.5497382199, "stock": 755000, "incomeCash": 955000, "used": 200000}, "rows": [[1, "iHAVECPU", 200000, 0, 200000, "จ่ายแล้ว", "1St", "ดูหลักฐาน"], [2, "P2W", 200000, 0, 200000, "จ่ายแล้ว", "1St (Aricat)", "ดูหลักฐาน"], [3, "EVNIA", 30000, 20000, 50000, "ยังไม่จ่าย", "หลังจบงาน", "30 JUN"], [4, "AMD", 100000, 0, 100000, "ยังไม่จ่าย", "หลังจบงาน", "30 JUN"], [5, "เครมิล", 100000, 0, 100000, "จ่ายแล้ว", "1St", "ดูหลักฐาน"], [6, "EGA", 25000, 30000, 55000, "จ่ายแล้ว", "1St", "ดูหลักฐาน"], [7, "iHAVECPU", 100000, 0, 100000, "ยังไม่จ่าย", "PROLEAGUE", "รอจัดงาน"], [8, "P2W", 200000, 0, 200000, "ยังไม่จ่าย", "PROLEAGUE / MINI TOUR / Steamer tour", "รอจัดงาน"]], "totals": [955000, 50000, 1005000], "used": [[1, "Tournament SOOP", 100000], [2, "Tournament Ari Cat", 100000]], "usedTotal": 200000, "byPartner": [["iHAVECPU", 300000, 0], ["P2W", 400000, 0], ["EVNIA", 30000, 20000], ["AMD", 100000, 0], ["เครมิล", 100000, 0], ["EGA", 25000, 30000]]}};
const reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches);
const fmt = n => n.toLocaleString('en-US');
const baht = n => '<span class="cur">฿</span>' + fmt(n);
const pctFmt = x => x ? (x*100).toFixed(2).replace(/\.?0+$/,'')+'%' : '0%';
const PC = {green:'#2E9E5B', emerald:'#1F6E43', forest:'#0E3B2C', clay:'#A8392F',
           gold:'#C18F2B', gold2:'#E6B84B', barter:'#9CC6A9', steel:'#5B7C68'};

/* ---------- helpers ---------- */
function el(tag, cls, html){const e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e;}

function secHead(kx, title, hint){
  return `<div class="sec-head"><span class="kx">${kx}</span><h2>${title}</h2>${hint?`<span class="hint">${hint}</span>`:''}</div>`;
}

/* ---------- KPI block ---------- */
function kpiBlock(k){
  const pctTxt = pctFmt(k.pct);
  const pctNum = Math.round(k.pct*100);
  return `<div class="kpis">
    <div class="kpi"><div class="lab"><span class="ic"></span>รายรับรวม (Cash + Barter)</div>
      <div class="val num" data-count="${k.total}">฿0</div>
      <div class="foot">มูลค่าที่ตกลงทั้งหมด</div></div>
    <div class="kpi k-paid"><div class="lab"><span class="ic"></span>รับชำระแล้ว (Cash)</div>
      <div class="val num" data-count="${k.paid}">฿0</div></div>
    <div class="kpi k-out"><div class="lab"><span class="ic"></span>ค้างรับ (Cash)</div>
      <div class="val num" data-count="${k.outstanding}">฿0</div></div>
    <div class="kpi k-pct"><div class="lab"><span class="ic"></span>% เก็บเงินแล้ว</div>
      <div class="val num">${pctTxt}</div>
      <div class="bar"><i data-w="${pctNum}"></i></div></div>
    <div class="kpi hero"><div class="coin"></div>
      <div class="hero-main">
        <div class="lab"><span class="ic"></span>MONEY IN STOCK</div>
        <div class="val num" data-count="${k.stock}">฿0</div></div>
      <div class="hero-side">เงินคงเหลือในกองทุนสปอนเซอร์<br>
        รายรับ (Cash) <b>฿${fmt(k.incomeCash)}</b> − งบที่ใช้ <b>฿${fmt(k.used)}</b></div>
    </div>
  </div>`;
}

/* ---------- Donut (SVG) ---------- */
function donut(segs, centerVal, centerLab){
  const R=62, r=40, cx=80, cy=80, C=2*Math.PI*((R+r)/2), sw=R-r;
  const total = segs.reduce((a,s)=>a+s.value,0)||1;
  let off=0, arcs='';
  segs.forEach((s,i)=>{
    const frac=s.value/total, len=frac*C;
    arcs += `<circle cx="${cx}" cy="${cy}" r="${(R+r)/2}" fill="none"
      stroke="${s.color}" stroke-width="${sw}" stroke-linecap="butt"
      stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}"
      transform="rotate(-90 ${cx} ${cy})" class="seg" style="--d:${C};--l:${len};--o:${-off};animation-delay:${i*.12}s"/>`;
    off+=len;
  });
  return `<div class="donut-wrap"><svg viewBox="0 0 160 160" width="170" height="170" role="img">
    <circle cx="${cx}" cy="${cy}" r="${(R+r)/2}" fill="none" stroke="#EFEDE2" stroke-width="${sw}"/>
    ${arcs}
    <g class="donut-center" text-anchor="middle">
      <text x="80" y="78" class="big num">${centerVal}</text>
      <text x="80" y="95" class="sm">${centerLab}</text></g></svg></div>`;
}

/* ---------- Stacked horizontal bars (by partner) ---------- */
function barsByPartner(rows){
  const max = Math.max(...rows.map(r=>r[1]+r[2]))||1;
  let body='';
  rows.forEach((r,i)=>{
    const [name,cash,barter]=r, tot=cash+barter;
    const wc=cash/max*100, wb=barter/max*100;
    body += `<div class="pb-row">
      <div class="pb-name">${name}</div>
      <div class="pb-track">
        <span class="pb-seg" style="width:${wc}%;background:${PC.emerald};animation-delay:${i*.06}s"></span>
        <span class="pb-seg" style="width:${wb}%;background:${PC.barter};animation-delay:${i*.06+.05}s"></span>
      </div>
      <div class="pb-val num">฿${fmt(tot)}</div></div>`;
  });
  return `<div class="pbars">${body}</div>`;
}

/* ---------- Cash flow (income -> used -> remaining) ---------- */
function cashflow(income, used, remain){
  const max=income||1;
  const seg=(lab,val,col,sign)=>`
    <div class="cf-step">
      <div class="cf-bar-wrap"><span class="cf-bar" style="height:${val/max*100}%;background:${col}"></span></div>
      <div class="cf-val num">${sign||''}฿${fmt(val)}</div>
      <div class="cf-lab">${lab}</div></div>`;
  return `<div class="cflow">
    ${seg('รายรับ (Cash)',income,PC.emerald)}
    <div class="cf-op">−</div>
    ${seg('งบที่ใช้',used,PC.clay)}
    <div class="cf-op">=</div>
    ${seg('คงเหลือ',remain,PC.gold)}
  </div>`;
}

/* ---------- Game dashboard ---------- */
function gamePanel(g){
  const paid = g.kpi.paid, out = g.kpi.outstanding;
  const dPaid = g.totals[0]? paid : 0;
  const donutSegs = (paid+out)>0
     ? [{label:'รับชำระแล้ว',value:paid,color:PC.green},{label:'ค้างรับ',value:out,color:PC.clay}]
     : [{label:'ค้างรับ',value:1,color:PC.clay}];
  const collectedFrac = g.kpi.incomeCash? paid/g.kpi.incomeCash : 0;

  let rows='';
  g.rows.forEach(r=>{
    const st = r[5]==='จ่ายแล้ว'?'st-paid':'st-wait';
    rows += `<tr>
      <td class="c muted num">${r[0]}</td>
      <td class="pname">${r[1]}</td>
      <td class="r num">฿${fmt(r[2])}</td>
      <td class="r num ${r[3]?'':'muted'}">${r[3]?'฿'+fmt(r[3]):'–'}</td>
      <td class="r num">฿${fmt(r[4])}</td>
      <td><span class="chip-st ${st}">${r[5]}</span></td>
      <td class="muted">${r[6]}</td>
      <td><span class="tag">${r[7]}</span></td></tr>`;
  });

  let usedTbl='';
  if(g.used.length){
    let ur=g.used.map(u=>`<tr><td class="c muted num">${u[0]}</td><td class="pname">${u[1]}</td>
        <td class="r num">฿${fmt(u[2])}</td></tr>`).join('');
    usedTbl = `<div class="tbl-card"><table>
      <thead><tr><th style="width:48px">#</th><th>รายการที่ดึงงบไปใช้</th><th class="r">บาท</th></tr></thead>
      <tbody>${ur}</tbody>
      <tfoot><tr><td colspan="2">รวมงบที่ใช้</td><td class="r num">฿${fmt(g.usedTotal)}</td></tr></tfoot>
    </table></div>`;
  } else {
    usedTbl = `<div class="tbl-card"><table>
      <thead><tr><th>รายการที่ดึงงบไปใช้</th><th class="r">บาท</th></tr></thead>
      <tbody><tr class="dim"><td>ยังไม่มีการดึงงบไปใช้</td><td class="r num">฿0</td></tr></tbody></table></div>`;
  }

  return secHead('Dashboard', g.name + ' · Income 2026', 'สรุปรายรับและกระแสเงิน')
   + kpiBlock(g.kpi)
   + secHead('Analytics','ภาพรวมเชิงวิเคราะห์','Financial Overview')
   + `<div class="charts">
        <div class="card">
          <div class="ch-head"><div class="t">สถานะการเก็บเงิน</div><div class="s">รับชำระแล้ว เทียบ ค้างรับ (Cash)</div></div>
          <div class="ch-body">${donut(donutSegs, pctFmt(collectedFrac),'เก็บแล้ว')}</div>
          <div class="legend">
            <div class="li"><span class="sw" style="background:${PC.green}"></span>รับชำระแล้ว <small>฿${fmt(paid)}</small></div>
            <div class="li"><span class="sw" style="background:${PC.clay}"></span>ค้างรับ <small>฿${fmt(out)}</small></div>
          </div>
        </div>
        <div class="card">
          <div class="ch-head"><div class="t">งบประมาณ (By Partner)</div><div class="s">มูลค่ารวม Cash + Barter ต่อพาร์ตเนอร์</div></div>
          <div class="ch-body">${barsByPartner(g.byPartner)}</div>
          <div class="legend">
            <div class="li"><span class="sw" style="background:${PC.emerald}"></span>Cash</div>
            <div class="li"><span class="sw" style="background:${PC.barter}"></span>Barter</div>
          </div>
        </div>
        <div class="card">
          <div class="ch-head"><div class="t">กระแสเงิน</div><div class="s">รายรับ → ใช้ → คงเหลือ</div></div>
          <div class="ch-body">${cashflow(g.kpi.incomeCash, g.kpi.used, g.kpi.stock)}</div>
        </div>
      </div>`
   + secHead('Detail','รายละเอียดรายรับจาก Partner','ตารางข้อมูลต้นทาง')
   + `<div class="tbl-card scroll-x"><table>
        <thead><tr>
          <th style="width:46px">No.</th><th>Partner</th>
          <th class="r">Cash</th><th class="r">Barter</th><th class="r">รวมมูลค่า</th>
          <th>สถานะการจ่าย</th><th>หมายเหตุ</th><th>หลักฐานการโอน</th>
        </tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr>
          <td colspan="2">รวมรายรับทั้งหมด</td>
          <td class="r num">฿${fmt(g.totals[0])}</td>
          <td class="r num">฿${fmt(g.totals[1])}</td>
          <td class="r num">฿${fmt(g.totals[2])}</td>
          <td colspan="3"></td></tr></tfoot>
      </table></div>`
   + secHead('Budget Used','งบที่ดึงไปใช้ & เงินคงเหลือ')
   + `<div class="grid2">
        ${usedTbl}
        <div class="note">
          <div class="l">MONEY IN STOCK</div>
          <div class="v num">${baht(g.kpi.stock)}</div>
          <div class="eq">เงินคงเหลือในกองทุนสปอนเซอร์<br>
            <code>฿${fmt(g.kpi.incomeCash)}</code> รายรับ (Cash) − <code>฿${fmt(g.kpi.used)}</code> งบที่ใช้
            = <code>฿${fmt(g.kpi.stock)}</code></div>
        </div>
      </div>`;
}

/* ---------- TR follow-up (outstanding) ---------- */
function outstandingTR(){
  const g=DATA.tr; const items=g.rows.filter(r=>r[5]==='ยังไม่จ่าย')
    .map(r=>({p:r[1],cash:r[2],barter:r[3],note:r[6],due:r[7]}));
  const totalOut=items.reduce((a,x)=>a+x.cash,0);
  const due30=items.filter(x=>x.due==='30 JUN').map(x=>x.p);
  const rows=items.map(x=>`<tr>
      <td class="pname">${x.p}</td>
      <td class="r num">฿${fmt(x.cash)}</td>
      <td class="r num ${x.barter?'':'muted'}">${x.barter?'฿'+fmt(x.barter):'–'}</td>
      <td class="muted">${x.note}</td>
      <td><span class="chip-st st-wait">${x.due}</span></td></tr>`).join('');
  return secHead('Follow-up','รายการค้างรับ — ติดตามการเก็บเงิน','Outstanding (Cash)')
    + `<div class="grid2" style="grid-template-columns:1.6fr 1fr">
        <div class="tbl-card scroll-x"><table>
          <thead><tr><th>Partner</th><th class="r">Cash ค้างรับ</th><th class="r">Barter</th><th>หมายเหตุ</th><th>กำหนด / สถานะ</th></tr></thead>
          <tbody>${rows}</tbody>
          <tfoot><tr><td>รวมค้างรับ (Cash)</td><td class="r num">฿${fmt(totalOut)}</td><td colspan="3"></td></tr></tfoot>
        </table></div>
        <div class="note"><div class="coin" style="opacity:.5"></div>
          <div class="l">ค้างรับรวม (Cash)</div>
          <div class="v num" data-count="${totalOut}">฿0</div>
          <div class="eq"><b>${items.length}</b> รายการที่ต้องติดตามการเก็บเงิน${due30.length?'<br>ครบกำหนด <code>30 JUN</code> — '+due30.join(', '):''}</div></div>
      </div>`;
}

/* ---------- inject extra CSS for bars/flow ---------- */
const extra = document.createElement('style');
extra.textContent = `
.seg{animation:draw 1.05s cubic-bezier(.22,1,.36,1) both}
@keyframes draw{from{stroke-dasharray:0 var(--d)}to{}}
.pbars{display:flex;flex-direction:column;gap:11px;padding:6px 1px}
.pb-row{display:grid;grid-template-columns:80px 1fr auto;align-items:center;gap:10px}
.pb-name{font-size:12.5px;font-weight:700;color:#33402f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pb-track{height:16px;border-radius:6px;background:#F0EEE2;display:flex;overflow:hidden}
.pb-seg{height:100%;transform-origin:left;animation:grow .9s cubic-bezier(.22,1,.36,1) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.pb-val{font-size:12.5px;font-weight:800;color:var(--forest);min-width:64px;text-align:right}
.cflow{display:flex;align-items:flex-end;gap:8px;height:188px;padding:6px 4px 0}
.cf-step{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end}
.cf-bar-wrap{flex:1;width:100%;max-width:62px;display:flex;align-items:flex-end}
.cf-bar{width:100%;border-radius:8px 8px 0 0;animation:rise 1s cubic-bezier(.22,1,.36,1) both;min-height:3px}
@keyframes rise{from{height:0!important}}
.cf-val{font-size:12.5px;font-weight:800;color:var(--forest);margin-top:8px;white-space:nowrap}
.cf-lab{font-size:11.5px;color:var(--muted);margin-top:2px;text-align:center}
.cf-op{font-size:20px;font-weight:800;color:#C7C3B0;padding-bottom:42px}
.mbars{display:flex;align-items:flex-end;gap:7px;height:200px;padding-top:18px}
.mb-col{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end}
.mb-tot{font-size:9.5px;font-weight:800;color:#5c6a5d;margin-bottom:5px;white-space:nowrap}
.mb-stack{width:100%;max-width:30px;flex:1;display:flex;flex-direction:column-reverse;justify-content:flex-start}
.mb-seg{width:100%;animation:rise 1s cubic-bezier(.22,1,.36,1) both}
.mb-stack span:first-child{border-radius:6px 6px 0 0}
.mb-x{font-size:11px;font-weight:700;color:var(--muted);margin-top:7px}
`;
document.head.appendChild(extra);

/* ---------- render ---------- */
document.getElementById('tr').innerHTML = gamePanel(DATA.tr) + outstandingTR();

/* ---------- animations ---------- */
function animate(panel){
  if(reduce) return;
  panel.querySelectorAll('[data-count]').forEach(node=>{
    const target=+node.getAttribute('data-count'); const dur=900; const t0=performance.now();
    function step(t){const p=Math.min((t-t0)/dur,1); const e=1-Math.pow(1-p,3);
      node.innerHTML='<span class="cur">฿</span>'+fmt(Math.round(target*e));
      if(p<1)requestAnimationFrame(step);}
    requestAnimationFrame(step);
  });
  requestAnimationFrame(()=>panel.querySelectorAll('.bar > i').forEach(b=>b.style.width=b.getAttribute('data-w')+'%'));
}
if(reduce){document.querySelectorAll('[data-count]').forEach(n=>n.innerHTML='<span class="cur">฿</span>'+fmt(+n.getAttribute('data-count')));
  document.querySelectorAll('.bar > i').forEach(b=>b.style.width=b.getAttribute('data-w')+'%');}
animate(document.getElementById('tr'));
</script>
</body>
</html>
